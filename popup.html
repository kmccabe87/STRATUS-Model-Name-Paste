<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STRATUS Model Delete Options</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Model Delete Options</h1>
      <label class="setting">
        <input id="auto-advance" type="checkbox">
        <span>
          <strong>Automatically acknowledge the first warning</strong>
          <small>Checks the permanent-deletion warning and clicks Next.</small>
        </span>
      </label>
      <p class="safety">The final “Delete Model and Data” button is never clicked automatically.</p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
